<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Pindorama Pets</title>
</head>

<body>
    <div class="cabecalho">
        <div id="logo_cabecalho">
            <img src="logo/Logo-horizontal.png" alt="">
        </div>
        <div id="navegar">
            <a href="/">Início</a>
            <a href="/">Serviços</a>
            <a href="/">Sobre nós</a>
            <a href="/">Contato</a>
        </div>
    </div>

    <div class="banner1">
        <div class="figura">
            <img id="onda" src="banner1/Waveform.png" alt="Detalhe">
        </div>
        <div class="conteudo">
            <h2>Cuidando do Seu Pet com Profissionalismo e Carinho </h2>
        </div>

        <div class="entre_contato">
            <a href="/">Entre em contato</a>
        </div>

        <div class="banner1_imagem">
            <img id="animais" src="banner1/animais2.png" alt="Animais">
            <img id="grupo_animais" src="banner1/animais1.png" alt="Grupo de animais">
            <img id="gato" src="banner1/gato.png" alt="Gato">
        </div>
    </div>

    <div class="carrossel_1">
        <button id="voltar"><img src="carrossel/flecha_volta.png" alt="Botão voltar"></button>

        <div class="imagem_carrossel">
            <div class="parte_1">
                <h2>Campanha de Vacinação</h2>
                <p>Nos dias 19 a 28 de novembro</p>
                <div class="parte_1_imagem">
                    <a href="/">Saiba mais</a>
                    <img id="pata1" src="carrossel/pata1.png" alt="Pata">
                    <img id="ciringa" src="carrossel/ciringa.png" alt="Ciringa">
                    <img id="pata2" src="carrossel/pata2.png" alt="Pata 2">
                    <img id="gato_pata" src="carrossel/gato.png" alt="Gato com a pata levantada">
                    <img id="posicao_1" src="carrossel/pontos1.png" alt="posição 1">
                </div>
            </div>
            <div class="parte_2">

            </div>
            <div class="parte_3">

            </div>
        </div>

        <button id="avancar"><img src="carrossel/flecha_frente.png" alt="Botão avançar"></button>

    </div>

    <script src="script.js"></script>
</body>
